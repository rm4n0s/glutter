version: "2"

run:
  go: "1.27"

linters:
  # Keep the default linters (errcheck, govet, ineffassign, staticcheck,
  # unused) and add the ones the project requires.
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
  settings:
    revive:
      rules:
        # Exported identifiers need a doc comment (CLAUDE.md "Definition of done").
        # Names follow Flutter (scheduler.SchedulerBinding, rendering.RenderBox),
        # so the check for names that repeat the package name is off.
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments

  exclusions:
    rules:
      # Go mirrors of C structs list every field, used or not, so that the offsets
      # of the fields that are used are right (layout tests check them).
      - path: internal/platform/linux/x11/structs\.go
        linters:
          - unused
      - path: internal/gpu/vulkan/structs\.go
        linters:
          - unused
      # The Go mirrors of Metal's structures are in a file with no OS tag (their layout is checked
      # against the SDK's headers) and only the darwin files use them, which a lint on another
      # system does not compile.
      - path: internal/gpu/metal/structs\.go
        linters:
          - unused

formatters:
  enable:
    - gofmt
