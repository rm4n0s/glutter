<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <title>A card with SVG text and a drop shadow</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="16" y="12" width="288" height="140" rx="14" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="36" y="32" width="56" height="6" rx="3" fill="url(#bar)"/>
  <text x="36" y="76" font-family="Roboto, sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">SVG text</text>
  <text x="36" y="104" font-family="Roboto, sans-serif" font-size="14" fill="#4b5563">Drawn from glyph outlines, under a</text>
  <text x="36" y="124" font-family="Roboto, sans-serif" font-size="14" fill="#4b5563"><tspan font-weight="700" fill="#4f46e5">drop-shadow</tspan> filter that blurs the card.</text>
</svg>
