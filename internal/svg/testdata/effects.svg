<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="clip"><circle cx="50" cy="50" r="30"/></clipPath>
    <mask id="fade"><rect width="100" height="100" fill="url(#ramp)"/></mask>
    <linearGradient id="ramp"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2"/></pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z"/></marker>
  </defs>
  <rect width="100" height="100" fill="url(#dots)"/>
  <g clip-path="url(#clip)"><rect width="100" height="100" fill="steelblue" mask="url(#fade)"/></g>
  <rect x="10" y="10" width="20" height="20" filter="url(#shadow)"/>
  <path d="M10 90 L90 90" stroke="black" marker-end="url(#arrow)"/>
</svg>
