<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="4" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#036" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="tint"/>
      <feMerge><feMergeNode in="tint"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#fff"/>
  <g filter="url(#shadow)"><rect x="12.3" y="12.3" width="40" height="35" fill="#fc3"/><circle cx="68.3" cy="62.3" r="18" fill="#c33"/></g>
</svg>
