<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="t"><feComponentTransfer><feFuncR type="table" tableValues="0 1"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="identity"/></feComponentTransfer></filter>
    <filter id="d"><feComponentTransfer><feFuncR type="discrete" tableValues="0 0.5 1"/><feFuncG type="discrete" tableValues="0 0.5 1"/><feFuncB type="discrete" tableValues="0 0.5 1"/></feComponentTransfer></filter>
    <filter id="l"><feComponentTransfer><feFuncR type="linear" slope="0.5" intercept="0.3"/><feFuncG type="linear" slope="0.5" intercept="0.3"/><feFuncB type="linear" slope="0.5" intercept="0.3"/></feComponentTransfer></filter>
    <filter id="g"><feComponentTransfer><feFuncR type="gamma" amplitude="1" exponent="3" offset="0"/><feFuncG type="gamma" amplitude="1" exponent="3" offset="0"/><feFuncB type="gamma" amplitude="1" exponent="3" offset="0"/></feComponentTransfer></filter>
    <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="0.5" stop-color="#e6a020"/><stop offset="1" stop-color="#fff"/></linearGradient>
  </defs>
  <rect width="100" height="100" fill="#fff"/>
  <rect x="5.3" y="5.3" width="40" height="40" fill="url(#r)" filter="url(#t)"/>
  <rect x="55.3" y="5.3" width="40" height="40" fill="url(#r)" filter="url(#d)"/>
  <rect x="5.3" y="55.3" width="40" height="40" fill="url(#r)" filter="url(#l)"/>
  <rect x="55.3" y="55.3" width="40" height="40" fill="url(#r)" filter="url(#g)"/>
</svg>
