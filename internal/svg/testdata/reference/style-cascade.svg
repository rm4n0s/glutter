<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100" color="#c33">
  <style>
    .a { fill: #36c; stroke: #000; stroke-width: 3 }
    #b { fill: #3a3 !important }
    g > rect { opacity: 0.7 }
    circle { fill: currentColor }
  </style>
  <rect class="a" x="5" y="5" width="40" height="40"/>
  <rect id="b" class="a" x="55" y="5" width="40" height="40" fill="red" style="fill: blue"/>
  <g><rect x="5" y="55" width="40" height="40" fill="#c60"/></g>
  <circle cx="75" cy="75" r="20"/>
  <circle cx="75" cy="75" r="8" style="color: #fc3"/>
</svg>
