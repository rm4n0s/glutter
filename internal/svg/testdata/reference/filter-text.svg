<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="b"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="s" x="-10%" y="-20%" width="130%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="100" height="100" fill="#fff"/>
  <text x="8.3" y="35.3" font-family="Roboto" font-size="26" font-weight="bold" fill="#036" filter="url(#b)">Blur</text>
  <text x="8.3" y="80.3" font-family="Roboto" font-size="26" font-weight="bold" fill="#c33" filter="url(#s)">Shadow</text>
</svg>
