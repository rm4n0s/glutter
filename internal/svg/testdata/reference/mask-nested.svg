<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <mask id="inner" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect x="0" y="0" width="50" height="100" fill="#fff"/></mask>
    <mask id="outer" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" mask="url(#inner)"><circle cx="50" cy="50" r="40" fill="#fff"/></mask>
    <mask id="child" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff" mask="url(#inner)"/></mask>
  </defs>
  <rect width="100" height="100" fill="#fff"/>
  <rect width="100" height="50" fill="#c33" mask="url(#outer)"/>
  <rect y="50" width="100" height="50" fill="#33c" mask="url(#child)"/>
</svg>
