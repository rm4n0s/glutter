<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="f" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="a"/>
      <feOffset in="a" dx="3" dy="3" result="b"/>
      <feFlood flood-color="#06c" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="d"/>
      <feColorMatrix in="SourceGraphic" type="saturate" values="0" result="gray"/>
      <feBlend in="gray" in2="d" mode="multiply" result="e"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="e"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#fff"/>
  <g filter="url(#f)"><rect x="12.3" y="14.3" width="46" height="30" fill="#e33"/><circle cx="66.3" cy="66.3" r="20" fill="#3a3"/></g>
</svg>
