<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <clipPath id="inner"><rect x="0" y="0" width="50" height="100"/></clipPath>
    <clipPath id="outer" clip-path="url(#inner)"><circle cx="50" cy="50" r="40"/></clipPath>
    <clipPath id="withchild"><rect x="5" y="5" width="90" height="90" clip-path="url(#inner)"/><circle cx="75" cy="25" r="15"/></clipPath>
  </defs>
  <rect width="100" height="100" fill="#c60" clip-path="url(#outer)"/>
  <rect width="100" height="100" fill="#36c" clip-path="url(#withchild)" opacity="0.4"/>
</svg>
