<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <filter id="lin" x="0" y="0" width="1" height="1"><feFlood flood-color="#f00" result="a"/><feFlood flood-color="#00f" result="b"/><feComposite in="a" in2="b" operator="arithmetic" k1="0" k2="0.5" k3="0.5" k4="0"/></filter>
    <filter id="srgb" color-interpolation-filters="sRGB" x="0" y="0" width="1" height="1"><feFlood flood-color="#f00" result="a"/><feFlood flood-color="#00f" result="b"/><feComposite in="a" in2="b" operator="arithmetic" k1="0" k2="0.5" k3="0.5" k4="0"/></filter>
    <filter id="m1"><feColorMatrix type="saturate" values="0.5"/></filter>
    <filter id="m2" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0.5"/></filter>
    <filter id="o1" x="0" y="0" width="1" height="1"><feFlood flood-color="#fff" flood-opacity="0.5" result="w"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="w"/></feMerge></filter>
    <filter id="o2" color-interpolation-filters="sRGB" x="0" y="0" width="1" height="1"><feFlood flood-color="#fff" flood-opacity="0.5" result="w"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="w"/></feMerge></filter>
  </defs>
  <rect width="100" height="100" fill="#fff"/>
  <rect x="5.3" y="5.3" width="40" height="25" fill="#000" filter="url(#lin)"/>
  <rect x="55.3" y="5.3" width="40" height="25" fill="#000" filter="url(#srgb)"/>
  <rect x="5.3" y="38.3" width="40" height="25" fill="#e83" filter="url(#m1)"/>
  <rect x="55.3" y="38.3" width="40" height="25" fill="#e83" filter="url(#m2)"/>
  <rect x="5.3" y="71.3" width="40" height="25" fill="#000" filter="url(#o1)"/>
  <rect x="55.3" y="71.3" width="40" height="25" fill="#000" filter="url(#o2)"/>
</svg>
